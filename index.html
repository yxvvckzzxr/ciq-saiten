<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self'; img-src 'self' data: blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png?v=4">
  <meta name="description" content="CIQ - クイズ大会のペーパー運営を、エントリーから成績返却まで。">
  <meta property="og:title" content="CIQ">
  <meta property="og:description" content="クイズ大会のペーパー運営を、エントリーから成績返却まで。">
  <meta property="og:type" content="website">
  <title>CIQ</title>
  <script defer src="js/config.js?v=2"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.min.js" integrity="sha384-fx4y4cDx8NYfissnVzdGJY3yVXWY3rn5ab5HTUjpvgT35oDiyAbjjqnLhnRmESNE" crossorigin="anonymous"></script>
  <script defer src="js/supabase_config.js?v=2"></script>
  <script defer src="js/supabase_client.js"></script>
  <script defer src="js/supabase_api.js?v=36"></script>
  <script defer src="js/crypto.js"></script>
  <script defer src="js/icons.js?v=8"></script>
  <script defer src="js/ui.js?v=22"></script>
  <script defer src="js/shared.js?v=2"></script>
  <link rel="stylesheet" href="css/design_system.css?v=77">
  <link rel="stylesheet" href="css/pages.css?v=125">
</head>

<body class="page-auth">
  <main class="auth">
    <p class="auth-brand">CIQ</p>
    <h1 class="auth-title" id="index-mode-title">ログイン</h1>
    <p class="auth-lede" id="index-mode-lede">運営と採点はGoogleアカウントで行います。</p>

    <div id="status-msg" class="status-msg-box" role="status" aria-live="polite"></div>

    <div class="auth-action" id="supabase-auth-panel" hidden>
      <button type="button" class="btn-google" id="supabase-login-btn">
        <img class="btn-google-mark" src="assets/vendor/google/g_mark.svg" alt="" aria-hidden="true" width="18" height="18">
        <span>Googleで続行</span>
      </button>
    </div>

    <!-- 参加(既定): 自分のプロジェクト -->
    <section class="auth-section" id="section-join" hidden>
      <h2 class="auth-section-title">参加している大会</h2>
      <div id="project-list" class="project-list"></div>
      <p class="auth-note">
        採点者として参加するには、管理者から共有された招待リンクを開いてください。
      </p>
    </section>

    <!-- 作成(#create でのみ表示・主催者向け) -->
    <section class="auth-section" id="section-create" hidden>
      <h2 class="auth-section-title">新しい大会</h2>
      <label for="create-edition">回数</label>
      <input type="number" id="create-edition" placeholder="13" min="1" max="999" inputmode="numeric" aria-describedby="create-edition-note" />
      <p class="field-note" id="create-edition-note">第13回なら 13。入力した回数からプロジェクトIDが発行されます。</p>
      <button class="btn u-full-width mt-md" id="create-btn">プロジェクトを作成</button>
    </section>

    <section class="auth-section" id="section-success" hidden>
      <h2 class="auth-section-title">プロジェクトを作成しました</h2>
      <label for="success-id">プロジェクトID</label>
      <div class="credential-row">
        <input type="text" id="success-id" readonly />
        <button class="btn standard credential-copy-btn" data-copy-target="success-id" aria-label="プロジェクトIDをコピー"><span data-icon="copy" aria-hidden="true"></span></button>
      </div>
      <p class="field-note">採点者は運営ホームで招待リンクを発行して招待します。</p>
      <button class="btn u-full-width mt-md" id="admin-proceed-btn">運営をはじめる</button>
    </section>

    <div class="auth-identity" id="auth-identity" hidden>
      <span class="auth-identity-user" id="supabase-auth-user"></span>
      <button type="button" class="btn ghost link-btn-sm" id="supabase-logout-btn" hidden>サインアウト</button>
    </div>
  </main>

  <nav class="auth-links" aria-label="補助リンク">
    <a href="#" class="auth-link u-hidden" id="index-join-link">ログインに戻る</a>
    <a href="help.html" class="auth-link">ヘルプ</a>
  </nav>
  <script defer src="js/index.js?v=18"></script>
</body>

</html>

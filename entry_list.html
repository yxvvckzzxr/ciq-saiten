<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self'; img-src 'self' data: blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png?v=4">
    <meta name="description" content="CIQ - クイズ大会の解答採点を支援するウェブプラットフォーム">
    <meta property="og:title" content="CIQ - 解答採点プラットフォーム">
    <meta property="og:description" content="クイズ大会の解答採点を支援するウェブプラットフォーム">
    <meta property="og:type" content="website">
    <title>CIQ - エントリーリスト</title>
    <script defer src="js/config.js?v=2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.min.js" integrity="sha384-fx4y4cDx8NYfissnVzdGJY3yVXWY3rn5ab5HTUjpvgT35oDiyAbjjqnLhnRmESNE" crossorigin="anonymous"></script>
    <script defer src="js/supabase_config.js?v=2"></script>
    <script defer src="js/supabase_client.js"></script>
    <script defer src="js/supabase_api.js?v=36"></script>
    <script defer src="js/icons.js?v=8"></script>
    <script defer src="js/ui.js?v=22"></script>
    <script defer src="js/shared.js?v=2"></script>
    <link rel="stylesheet" href="css/design_system.css?v=77">
    <link rel="stylesheet" href="css/pages.css?v=125">
</head>
<body class="page-wrapper page-entry-list">
    <div class="page-container full">
        <div class="page-logo">
            <span class="logo-icon"><span data-icon="list" aria-hidden="true"></span></span>
            <h1 id="page-title">エントリーリスト</h1>
            <div class="logo-sub" id="page-subtitle">エントリーリスト</div>
        </div>

        <div id="content-area" class="u-hidden">
            <p class="entry-list-count" role="status" aria-live="polite">
                <strong id="total-count">-</strong>名がエントリー<span id="entry-capacity"></span>
            </p>

            <div class="list-container">
                <table>
                    <caption class="u-hidden">エントリー一覧</caption>
                    <thead>
                        <tr>
                            <th scope="col">受付番号</th>
                            <th scope="col">日時</th>
                            <th scope="col">エントリーネーム</th>
                            <th scope="col">所属</th>
                            <th scope="col">学年</th>
                            <th scope="col">意気込み</th>
                        </tr>
                    </thead>
                    <tbody id="list-body">
                        <tr><td colspan="6" class="entry-list-loading-cell"><span data-icon="spinner" aria-hidden="true"></span> 読み込み中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="page-card page-disabled is-disabled" id="disabled-msg" role="status">
            <span data-icon="lock" aria-hidden="true"></span>
            現在エントリーリストは非公開です。
        </div>

    </div>

    <script defer src="js/entry_list.js?v=11"></script>
</body>
</html>
